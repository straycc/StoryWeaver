version: novel-ab-v1
case_id: yanmen-scroll-12
description: 12章武侠悬疑连续创作，测试计划执行、人物状态、知识边界、伏笔和时间线一致性。

experiment:
  title: 12章连续小说裸模型与 StoryWeaver A/B 评测
  temperature: 0.6
  repetitions: 1
  skill_ids: []

book:
  title: 雁门残卷
  genre: 武侠悬疑
  premise: >
    年轻捕快林默进入边城雁门，调查十年前父亲林守义与十二名驿卒一同失踪的旧案。
    他从一名行踪可疑的货郎孙七身上发现北门古道的红土，并逐渐意识到旧案仍有人在掩盖。
  protagonist: 林默
  central_conflict: >
    林默必须在官府封存旧案、证人接连失踪的阻力下找到第二封驿信，
    同时避免调查伤害师姐苏晚及其父亲苏鸿远。
  tone: 第三人称有限视角，克制、冷峻，以动作、环境和对白表现情绪，不使用全知视角。
  target_chapters: 12
  chapter_target_words: 1400
  language: zh

  characters:
    - id: lin-mo
      name: 林默
      description: 二十四岁捕快，谨慎固执，擅长剑术但不善水；只知道父亲死于十年前旧案，不知道父亲可能仍活着。
    - id: su-wan
      name: 苏晚
      description: 林默的师姐，冷静敏锐；起初不知道林默正在调查自己的父亲苏鸿远。
    - id: sun-qi
      name: 孙七
      description: 走街串巷的货郎，善于说谎，掌握旧驿路的线索；并非幕后主使。
    - id: su-hongyuan
      name: 苏鸿远
      description: 雁门守备旧部、苏晚之父，十年前参与封锁北门古道，对旧案有所隐瞒。

  initial_canon:
    - id: canon-water
      content: 林默不善水，不能毫无困难地游过深水。
    - id: canon-knowledge
      content: 故事开始时，苏晚不知道林默正在调查她的父亲。
    - id: canon-soil
      content: 暗红黏土只分布在废弃的北门古道一带。
    - id: canon-letters
      content: 十年前驿卒曾送出两封信，第一封已被官府收走，第二封下落不明。
    - id: canon-sunqi
      content: 孙七参与运送线索但不是幕后主使。

chapters:
  - number: 1
    title: 雨夜来客
    input:
      objective: 林默抵达雁门客栈，从孙七身上发现旧案的第一条现实线索。
      required_beats:
        - 林默在雨夜进入雁门客栈
        - 孙七刻意遮挡自己的靴子
        - 林默注意到孙七靴底的暗红泥土
      constraints:
        - 不揭晓孙七的真实目的
        - 不解释红土的确切来源
        - 结尾保留追查动力
    expectations:
      required_facts:
        - 林默刚抵达雁门并开始调查父亲旧案
        - 孙七靴底存在暗红泥土
      forbidden_events:
        - 孙七主动交代全部真相
        - 林默已经确认幕后主使
        - 直接找到第二封信
      continuity_sources: [canon-soil, canon-letters, canon-sunqi]
      focus: [基础设定遵循, 悬念建立]

  - number: 2
    title: 北门旧路
    input:
      objective: 林默追查红土来源，在封闭的北门古道入口发现近期有人经过。
      required_beats:
        - 林默确认红土来自北门古道
        - 古道入口名义上已经封闭多年
        - 林默发现不超过三日的新车辙
      constraints:
        - 孙七暂时逃脱跟踪
        - 不发现第二封信原件
    expectations:
      required_facts:
        - 红土线索承接第一章孙七的靴底
        - 北门古道近期仍有人使用
      forbidden_events:
        - 把红土改成来自其他地点
        - 林默放弃旧案调查
      continuity_sources: [canon-soil]
      focus: [线索连续性, 因果推进]

  - number: 3
    title: 师姐入关
    input:
      objective: 苏晚来到雁门协助林默，但林默暂时隐瞒调查涉及苏鸿远。
      required_beats:
        - 苏晚在城门附近找到林默
        - 二人交换对旧案的有限信息
        - 林默避开提及苏鸿远的名字
      constraints:
        - 严格保持林默的有限视角
        - 苏晚不能知道父亲已成为调查对象
    expectations:
      required_facts:
        - 苏晚仍不知道林默调查她父亲
        - 苏晚知道林默正在调查十年前旧案
      forbidden_events:
        - 苏晚直接质问林默为何调查苏鸿远
        - 叙述直接展示苏晚独处时的内心活动
      continuity_sources: [canon-knowledge]
      focus: [角色知识边界, 有限视角]

  - number: 4
    title: 巷中伏击
    input:
      objective: 林默和苏晚遭遇伏击，林默左手受伤，袭击者遗落带驿站印记的铜扣。
      required_beats:
        - 两人在狭窄雨巷遭遇两名蒙面人
        - 林默左手被短刃划伤且影响发力
        - 袭击者遗落一枚旧驿站铜扣
      constraints:
        - 苏晚帮助二人脱身
        - 蒙面人身份不能揭晓
    expectations:
      required_facts:
        - 林默左手伤势会影响后续至少两章
        - 铜扣与十年前驿站有关
      forbidden_events:
        - 林默受伤后立即痊愈
        - 苏晚得知父亲是调查对象
      continuity_sources: [canon-knowledge]
      focus: [人物状态更新, 物品线索]
      state_updates:
        - subject: 林默
          field: 左手状态
          old_value: 正常
          new_value: 被短刃划伤，发力受限

  - number: 5
    title: 佛座空痕
    input:
      objective: 林默带伤检查废庙，在佛像底座发现曾经藏过信件的空槽和半枚火漆。
      required_beats:
        - 林默的左手伤势影响攀爬或搜查
        - 佛像底座存在近期被打开的暗槽
        - 暗槽内只剩半枚带雁纹的火漆
      constraints:
        - 第二封信已经被别人先取走
        - 不解释取信者身份
    expectations:
      required_facts:
        - 林默左手仍未恢复
        - 空槽与失踪的第二封信存在关联可能
      forbidden_events:
        - 林默获得完整第二封信
        - 林默用受伤左手完成高强度动作而毫无影响
      continuity_sources: [canon-letters]
      focus: [伤势连续性, 伏笔推进]

  - number: 6
    title: 货郎的谎话
    input:
      objective: 林默截住孙七，通过红土、车辙和火漆拆穿其谎言，但只确认他替人运送过物件。
      required_beats:
        - 孙七先否认去过北门古道
        - 林默用已有三项线索逼迫孙七改口
        - 孙七承认替蒙面雇主送过木匣
      constraints:
        - 孙七不能知道雇主真实身份
        - 孙七不是幕后主使
        - 林默左手仍不适合持剑久战
    expectations:
      required_facts:
        - 推理必须使用红土、新车辙和雁纹火漆
        - 孙七只承担中间运送角色
      forbidden_events:
        - 孙七被写成策划旧案的幕后主使
        - 林默凭空知道雇主身份
      continuity_sources: [canon-soil, canon-sunqi]
      focus: [多线索合并, 伤势连续性]

  - number: 7
    title: 断剑
    input:
      objective: 林默追踪木匣至废驿站，与蒙面人交战，父亲留下的青霜剑折断。
      required_beats:
        - 林默在废驿站遭遇蒙面人
        - 左手伤势迫使林默改变惯用剑法
        - 青霜剑在交战中折断
        - 蒙面人带走木匣逃离
      constraints:
        - 林默不能立即获得替代武器
        - 蒙面人身份仍不能揭晓
    expectations:
      required_facts:
        - 青霜剑在本章后不再是完好武器
        - 林默没有夺回木匣
      forbidden_events:
        - 青霜剑折断后继续正常使用
        - 林默当场得到另一柄宝剑
      focus: [关键状态更新, 战斗因果]
      state_updates:
        - subject: 林默
          field: 武器
          old_value: 完好的青霜剑
          new_value: 折断的青霜剑

  - number: 8
    title: 无锋追迹
    input:
      objective: 失去完好佩剑的林默继续追踪木匣，从车辙深浅判断运送者改走河滩。
      required_beats:
        - 林默携带断剑而不是完好的青霜剑
        - 林默通过车辙变化判断木匣被转运
        - 河滩水势阻断林默直接追赶
      constraints:
        - 林默不善水，不能直接游过急流
        - 通过观察和绕行解决问题
    expectations:
      required_facts:
        - 青霜剑已经折断
        - 林默左手伤势可以缓解但不能突然完全消失
        - 林默不能轻松游过深水
      forbidden_events:
        - 青霜剑恢复完好
        - 林默展示高超水性直接渡河
      continuity_sources: [canon-water]
      focus: [新状态覆盖旧状态, 身体限制]

  - number: 9
    title: 三日前的车
    input:
      objective: 林默结合古道车辙、河滩痕迹和城门记录，确认木匣在三日前经北门转运。
      required_beats:
        - 查阅北门三日前的出入记录
        - 将记录与第二章发现的新车辙对应
        - 锁定一辆属于守备旧部的灰篷车
      constraints:
        - 时间推理必须前后一致
        - 只锁定车辆来源，不能直接锁定幕后主使
    expectations:
      required_facts:
        - 第二章车辙不超过三日
        - 木匣转运发生在林默抵达雁门之前
      forbidden_events:
        - 把车辙写成十年前留下
        - 仅凭车辆就确认苏鸿远是幕后主使
      focus: [时间线一致性, 证据强度]

  - number: 10
    title: 雁纹旧印
    input:
      objective: 第一章红土、第四章铜扣和第五章火漆在守备旧库汇合，指向十年前被撤销的驿路护送队。
      required_beats:
        - 苏晚辨认出铜扣属于旧护送队
        - 火漆雁纹与旧库印模吻合
        - 林默意识到三条早期线索属于同一运输链
      constraints:
        - 苏晚仍不知道林默怀疑苏鸿远
        - 不把线索巧合写成直接口供
    expectations:
      required_facts:
        - 红土、铜扣和火漆均得到回收
        - 证据只证明运输链存在
      forbidden_events:
        - 遗忘或篡改早期线索来源
        - 苏晚突然知道全部调查内容
      continuity_sources: [canon-knowledge, canon-soil]
      focus: [早期线索回收, 知识边界]

  - number: 11
    title: 师门旧债
    input:
      objective: 林默向苏晚坦白苏鸿远参与封锁古道，二人冲突后决定共同向苏鸿远求证。
      required_beats:
        - 林默主动说明自己隐瞒的调查方向
        - 苏晚因被隐瞒而愤怒但没有立刻与林默决裂
        - 二人确认苏鸿远参与封路但未必策划旧案
      constraints:
        - 苏晚从本章起才明确知道父亲是调查对象
        - 不能把苏鸿远直接定为幕后主使
    expectations:
      required_facts:
        - 前十章的知识边界在本章发生明确更新
        - 苏晚知道林默正在调查苏鸿远
      forbidden_events:
        - 声称苏晚此前一直知道林默的怀疑
        - 没有证据就认定苏鸿远策划全部事件
      continuity_sources: [canon-knowledge]
      focus: [知识状态更新, 人物冲突]
      state_updates:
        - subject: 苏晚
          field: 已知信息
          old_value: 不知道林默调查苏鸿远
          new_value: 知道林默正在调查苏鸿远

  - number: 12
    title: 第二封信
    input:
      objective: 林默和苏晚从苏鸿远处取得第二封信，查明十二名驿卒因保护证人而失踪，但父亲生死仍留悬念。
      required_beats:
        - 苏鸿远承认参与封锁古道是为了掩护证人撤离
        - 第二封信证明驿卒主动改变路线保护证人
        - 林默发现父亲可能活着的新线索
        - 本阶段旧案得到部分解释并留下后续目标
      constraints:
        - 苏鸿远不能被简单写成幕后主使
        - 孙七的中间人身份保持一致
        - 结局回收核心伏笔但不解决父亲生死
    expectations:
      required_facts:
        - 第二封信原件最终出现
        - 十二名驿卒失踪与保护证人有关
        - 林守义的生死仍未确认
      forbidden_events:
        - 宣布林守义已经确定死亡或确定生还
        - 把孙七改写为幕后主使
        - 青霜剑无解释地恢复完好
      continuity_sources: [canon-letters, canon-sunqi]
      focus: [伏笔回收, 阶段结局, 全局连续性]
