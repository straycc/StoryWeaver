version: novel-ab-v1
case_id: snow-harbor-ledger-12
description: 12章架空谍战悬疑连续创作，重点测试跨章伤势、感官缺陷、物品归属、角色知识边界、双份密码、潮汐时间线与幕后层级。

experiment:
  title: 复杂状态连续小说裸模型与 StoryWeaver A/B 评测
  temperature: 0.6
  repetitions: 1
  skill_ids: []

book:
  title: 雪港无灯
  genre: 架空谍战悬疑
  premise: >
    永熙十二年冬，雪港城负责抄录潮闸文书的沈砚，接到濒死驿卒罗成送来的半幅潮汐暗码和一枚铜钥匙。
    暗码牵涉三年前失踪的赈银船“静海号”，也指向城中有人长期利用夜潮偷运军械。
    沈砚必须在五日后的封港令生效前找到原始账册，同时分辨医女顾清禾、船户秦照与巡防使贺兰舟各自隐瞒的真相。
  protagonist: 沈砚
  central_conflict: >
    沈砚要在巡防司追捕、潮闸记录被篡改和盟友彼此隐瞒的情况下拼合两半暗码，取得静海号账册；
    他既不能让证据落入幕后主使之手，也不能因急于求证而暴露代号“白鹭”的秘密交通线。
  tone: 第三人称限知视角，主要跟随沈砚；克制冷峻，以行动、物证、环境和对话表现判断，不直接展示其他人物独处时的内心。
  target_chapters: 12
  chapter_target_words: 1400
  language: zh

  characters:
    - id: shen-yan
      name: 沈砚
      description: 二十七岁潮闸文书，谨慎善记，左耳幼年受伤近乎失聪且不会游泳；故事开始时不知道“白鹭”的身份。
    - id: gu-qinghe
      name: 顾清禾
      description: 城南医女，真实身份是秘密交通员“白鹭”；持有暗码下半幅，但不知道静海号账册的确切藏处。
    - id: qin-zhao
      name: 秦照
      description: 熟悉潮沟的船户，知道顾清禾就是白鹭；表面散漫，实际负责保护交通线，不识暗码内容。
    - id: helan-zhou
      name: 贺兰舟
      description: 雪港巡防使，负责篡改潮闸记录和运送军械，但只是执行者，并非最终幕后主使。
    - id: xu-chong
      name: 徐崇
      description: 雪港知府，表面主持追查赈银旧案，实际是走私网络幕后主使；其身份只能在证据链完整后揭晓。

  initial_canon:
    - id: canon-hearing
      content: 沈砚左耳近乎失聪，从左后方传来的轻声和脚步容易漏听；该缺陷不会突然痊愈。
    - id: canon-water
      content: 沈砚不会游泳，进入深水必须依靠船、绳索或他人帮助，不能独自泅渡。
    - id: canon-cipher
      content: 潮汐暗码分为上下两半；上半幅由罗成交给沈砚，下半幅藏在顾清禾的医书夹层，任何一半都不能单独推出账册位置。
    - id: canon-egret
      content: 顾清禾就是代号“白鹭”的交通员；秦照早已知情，沈砚直到第9章顾清禾主动承认后才确认。
    - id: canon-key
      content: 铜钥匙最初由罗成转交沈砚；物品归属只能通过正文中的明确交接改变，搜查、失踪或推测不能让钥匙自动回到沈砚手中。
    - id: canon-timeline
      content: 故事主线从第一日夜间持续到第五日上午；罗成第一日戌末遇袭、亥初见到沈砚，潮闸当夜实际在戌正至亥正被秘密开启。
    - id: canon-antagonist
      content: 贺兰舟参与篡改记录但不是幕后主使；徐崇才是主使，在第12章前不能被角色确认。
    - id: canon-pov
      content: 正文主要采用沈砚的第三人称限知视角；在秘密向沈砚揭晓前，不得直接叙述顾清禾或秦照独处时的真实想法和秘密行动。

chapters:
  - number: 1
    title: 夜潮来函
    input:
      objective: 第一日亥初，沈砚在潮闸文书房接应濒死的罗成，得到暗码上半幅和铜钥匙，并因抢救灯火而灼伤左掌。
      required_beats:
        - 罗成带伤抵达文书房并警告潮闸记录有假
        - 罗成把油纸暗码上半幅和铜钥匙明确交给沈砚
        - 沈砚左掌被倾倒的灯油灼伤
      constraints:
        - 不说明暗码下半幅在顾清禾手中
        - 不揭晓白鹭身份或幕后主使
        - 罗成遇袭时间保持为第一日戌末
    expectations:
      required_facts:
        - 第一章结束时铜钥匙由沈砚持有
        - 沈砚只有暗码上半幅
        - 沈砚左掌形成需要后续处理的灼伤
      forbidden_events:
        - 沈砚当场破解完整暗码
        - 罗成说出徐崇是幕后主使
        - 沈砚左掌没有受伤或立即恢复
      continuity_sources: [canon-cipher, canon-key, canon-timeline, canon-antagonist]
      focus: [初始状态建立, 物品归属, 时间锚点]
      state_updates:
        - subject: 铜钥匙
          field: 持有者
          old_value: 罗成
          new_value: 沈砚
        - subject: 沈砚
          field: 左掌状态
          old_value: 正常
          new_value: 新鲜灼伤，握持疼痛

  - number: 2
    title: 左侧来声
    input:
      objective: 第二日黎明，沈砚带着证物离开文书房，因左耳失聪漏听跟踪者接近，但保住证物并发现巡防司制式靴印。
      required_beats:
        - 跟踪者从沈砚左后方接近且一度占得先机
        - 沈砚通过倒影或环境变化察觉危险而非突然听清
        - 沈砚确认雪地靴印来自巡防司
      constraints:
        - 铜钥匙和暗码上半幅仍由沈砚持有
        - 左掌灼伤影响攀爬或持握
        - 不确认跟踪者具体身份
    expectations:
      required_facts:
        - 左耳失聪对行动产生实际影响
        - 左掌仍处于新鲜灼伤状态
        - 沈砚保有钥匙与暗码上半幅
      forbidden_events:
        - 沈砚听清左后方耳语
        - 左掌无痛使用重物或武器
        - 直接认定贺兰舟就是幕后主使
      continuity_sources: [canon-hearing, canon-key, canon-antagonist]
      focus: [永久缺陷, 伤势延续, 证物连续性]

  - number: 3
    title: 医馆借灯
    input:
      objective: 第二日上午，沈砚到顾清禾医馆处理灼伤，只让她看见暗码上半幅，没有暴露铜钥匙；双方都保留秘密。
      required_beats:
        - 顾清禾为沈砚清创并包扎左掌
        - 顾清禾看见暗码上半幅上的潮纹记号
        - 沈砚把铜钥匙继续藏在自己身上
      constraints:
        - 沈砚不能知道顾清禾就是白鹭
        - 不直接展示顾清禾识出暗码后的内心独白
        - 顾清禾不能拿出下半幅
    expectations:
      required_facts:
        - 顾清禾知道沈砚持有暗码上半幅
        - 顾清禾尚不知道沈砚还持有铜钥匙
        - 沈砚只把顾清禾视为可能知情的医女
      forbidden_events:
        - 顾清禾承认白鹭身份
        - 叙述顾清禾独处时查看下半幅
        - 铜钥匙无交接地变成顾清禾持有
      continuity_sources: [canon-cipher, canon-egret, canon-key, canon-pov]
      focus: [双向知识边界, 限知视角, 隐藏物品]

  - number: 4
    title: 半幅无解
    input:
      objective: 第二日夜间，沈砚和顾清禾尝试辨认上半幅，只能确认它需要另一半与特定潮时共同解读。
      required_beats:
        - 二人发现上半幅存在被裁断的对应线
        - 顾清禾以医书或旧航例掩饰自己对暗码体系的熟悉
        - 沈砚判断下一步应核对潮闸原始时刻
      constraints:
        - 不得推出账册具体位置
        - 顾清禾不能展示下半幅
        - 沈砚仍不能确认白鹭身份
    expectations:
      required_facts:
        - 暗码单独一半不可解
        - 沈砚开始怀疑顾清禾知道得比表面更多但没有证据
        - 铜钥匙仍由沈砚持有
      forbidden_events:
        - 上半幅直接显示钟楼或账册位置
        - 顾清禾完整解释暗码
        - 沈砚称顾清禾为白鹭
      continuity_sources: [canon-cipher, canon-egret, canon-key, canon-pov]
      focus: [信息不完整性, 怀疑与确认区分, 伏笔控制]

  - number: 5
    title: 两本潮簿
    input:
      objective: 第三日上午，沈砚比对官署潮簿和码头水尺，证明第一日夜间的官方闭闸记录被篡改，但无法确定篡改者。
      required_beats:
        - 官署潮簿记载第一日酉正闭闸
        - 水尺与船户记录证明潮闸在戌正至亥正开启
        - 罗成戌末遇袭、亥初抵达的时间能与秘密开闸重叠
      constraints:
        - 只能确认记录造假，不能确认徐崇或贺兰舟下令
        - 不改变此前日次与时辰
        - 左掌包扎仍影响快速誊抄
    expectations:
      required_facts:
        - 官方记录与物理潮痕形成可验证矛盾
        - 罗成遇袭时间处于秘密开闸窗口
        - 沈砚掌握的是时间线证据而非幕后身份
      forbidden_events:
        - 把秘密开闸写成第二日夜间
        - 官署潮簿与真实记录完全一致
        - 沈砚据此直接确认徐崇是主使
      continuity_sources: [canon-timeline, canon-antagonist, canon-pov]
      focus: [精确时间线, 证据层级, 伤势延续]

  - number: 6
    title: 钥匙易手
    input:
      objective: 第三日下午，巡防司开始搜查文书住处，沈砚在秦照船上把铜钥匙明确交给秦照保管，自己继续持有暗码上半幅。
      required_beats:
        - 秦照提出把金属证物藏入船上暗舱
        - 沈砚亲手把铜钥匙交给秦照并约定取回暗号
        - 巡防司随后搜查沈砚但没有找到钥匙
      constraints:
        - 暗码上半幅不能一起交出
        - 秦照不能解释钥匙用途
        - 沈砚左掌尚未完全恢复
    expectations:
      required_facts:
        - 第六章结束时铜钥匙持有者是秦照
        - 暗码上半幅持有者仍是沈砚
        - 搜查失败不能使钥匙自动回到沈砚手中
      forbidden_events:
        - 搜查后沈砚仍从身上掏出铜钥匙
        - 秦照当场用钥匙打开账册藏处
        - 沈砚把上下两半暗码都交给秦照
      continuity_sources: [canon-cipher, canon-key, canon-antagonist]
      focus: [显式物品交接, 分离证物, 搜查因果]
      state_updates:
        - subject: 铜钥匙
          field: 持有者
          old_value: 沈砚
          new_value: 秦照

  - number: 7
    title: 雾船空泊
    input:
      objective: 第三日夜间，秦照的船空泊在芦湾，秦照失踪；沈砚只找到他刻意留下的活命信号，无法取回钥匙。
      required_beats:
        - 沈砚发现空船和被割断的系缆
        - 船上没有铜钥匙且暗舱有被主动清理的痕迹
        - 秦照留下双方约定的活命信号，说明失踪不等于死亡
      constraints:
        - 沈砚仍不知道钥匙已被秦照转交给谁
        - 不直接叙述秦照离船后的秘密行动
        - 不确认顾清禾就是白鹭
    expectations:
      required_facts:
        - 秦照状态是失踪但有存活迹象，不是确认死亡
        - 铜钥匙不在沈砚手中
        - 沈砚只能推断秦照主动转移了证物
      forbidden_events:
        - 沈砚在空船上重新获得钥匙
        - 全知叙述秦照把钥匙交给顾清禾的过程
        - 宣布秦照已经死亡
      continuity_sources: [canon-egret, canon-key, canon-pov]
      focus: [失踪与死亡区分, 物品未知位置, 视角隔离]
      state_updates:
        - subject: 秦照
          field: 公开状态
          old_value: 可联络
          new_value: 失踪但留有存活信号

  - number: 8
    title: 雪巷白羽
    input:
      objective: 第四日黎明，沈砚在雪巷遭伏击，左耳缺陷和未愈左掌共同增加风险；顾清禾用白鹭交通线的白羽信号助他脱身，却没有立刻承认身份。
      required_beats:
        - 伏击者利用沈砚左侧听觉盲区接近
        - 沈砚左掌伤口结痂但强力握持时重新裂开
        - 顾清禾留下白羽信号引导沈砚走安全路线
      constraints:
        - 沈砚只能高度怀疑顾清禾与白鹭有关，不能确认
        - 沈砚不能独自跳入深水逃生
        - 不展示顾清禾设置白羽信号时的内心
    expectations:
      required_facts:
        - 永久听觉缺陷与暂时伤势同时影响行动
        - 左掌状态由新鲜灼伤发展为结痂但可裂开
        - 白羽是身份线索而不是正式揭晓
      forbidden_events:
        - 沈砚左耳恢复正常
        - 沈砚独自泅渡潮沟
        - 沈砚明确称顾清禾就是白鹭
      continuity_sources: [canon-hearing, canon-water, canon-egret, canon-pov]
      focus: [多状态叠加, 渐进恢复, 怀疑与确认]
      state_updates:
        - subject: 沈砚
          field: 左掌状态
          old_value: 新鲜灼伤，握持疼痛
          new_value: 已结痂但强力握持会裂开

  - number: 9
    title: 白鹭开口
    input:
      objective: 第四日上午，顾清禾主动承认白鹭身份，拿出暗码下半幅和秦照转交的铜钥匙，与沈砚完成知识对齐。
      required_beats:
        - 顾清禾明确说出自己就是白鹭
        - 顾清禾拿出下半幅并说明一直藏在医书夹层
        - 顾清禾说明秦照失踪前已把铜钥匙交给她
      constraints:
        - 身份揭晓发生在本章对话中，不能改写成沈砚早已确认
        - 秦照仍是失踪状态，不能确认死亡
        - 拼合暗码只能得到开启条件，不能立刻取得账册
    expectations:
      required_facts:
        - 沈砚从本章开始确认顾清禾是白鹭
        - 下半幅由顾清禾持有
        - 铜钥匙当前由顾清禾持有且来源是秦照的明确转交
      forbidden_events:
        - 声称沈砚在第八章前已经确认白鹭身份
        - 钥匙无交接地从秦照回到沈砚
        - 本章直接抓获幕后主使
      continuity_sources: [canon-cipher, canon-egret, canon-key, canon-antagonist]
      focus: [知识状态更新, 延迟交代的物品链, 揭晓时机]
      state_updates:
        - subject: 沈砚
          field: 对白鹭身份的认知
          old_value: 怀疑但未确认
          new_value: 确认顾清禾就是白鹭
        - subject: 铜钥匙
          field: 持有者
          old_value: 秦照
          new_value: 顾清禾

  - number: 10
    title: 钟楼暗格
    input:
      objective: 第四日夜间，沈砚与顾清禾拼合暗码，在旧钟楼找到需要铜钥匙开启的暗格，取得贺兰舟篡改记录的副簿，但账册仍在潮闸底仓。
      required_beats:
        - 上下两半暗码拼合后给出第四更与钟影方位
        - 顾清禾使用自己持有的铜钥匙打开钟楼暗格
        - 副簿证明贺兰舟执行过篡改但另有上级签押
      constraints:
        - 贺兰舟不能被认定为最终幕后主使
        - 徐崇的签押只能是待验证线索，不能在本章定罪
        - 铜钥匙使用后仍由顾清禾保管
    expectations:
      required_facts:
        - 完整暗码需要上下两半共同参与
        - 钟楼暗格只有副簿，不是最终账册
        - 证据表明贺兰舟是执行者而非最高层
      forbidden_events:
        - 只用上半幅独立找到暗格
        - 在钟楼直接取得静海号原始账册
        - 正式确认徐崇是幕后主使
      continuity_sources: [canon-cipher, canon-key, canon-antagonist, canon-timeline]
      focus: [双钥信息合并, 证据层级, 反派层级]

  - number: 11
    title: 逆潮入仓
    input:
      objective: 第五日寅末，沈砚、顾清禾进入潮闸底仓取账册；顾清禾把钥匙交给沈砚开锁，秦照现身驾船接应，沈砚不得独自泅水。
      required_beats:
        - 顾清禾在底仓门前把铜钥匙明确交给沈砚
        - 沈砚依靠安全绳和秦照的小船跨过深水段
        - 三人取得静海号原始账册并确认秦照此前是假失踪避捕
      constraints:
        - 沈砚不会游泳的设定必须产生行动限制
        - 左掌强力用力仍会疼痛但不必继续流血
