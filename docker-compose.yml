services:
  api:
    build: .
    environment:
      STORYWEAVER_DATABASE_PATH: /app/data/storyweaver.db
      STORYWEAVER_API_HOST: 0.0.0.0
      STORYWEAVER_API_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./data/model-config:/root/.storyweaver

  web:
    build: ./frontend
    environment:
      STORYWEAVER_API_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
