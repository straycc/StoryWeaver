services:
  api:
    build: .
    environment:
      STORYWEAVER_DATABASE_PATH: /app/data/storyweaver.db
      STORYWEAVER_API_HOST: 0.0.0.0
      STORYWEAVER_API_PORT: "8000"
      # 联网调研：从宿主机 .env 透传（compose 自动读取同目录 .env 做变量替换）。
      # 留空则功能降级为「未配置」，不影响其他能力。
      STORYWEAVER_TAVILY_API_KEY: ${STORYWEAVER_TAVILY_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./data/model-config:/root/.storyweaver

  web:
    build: ./frontend
    environment:
      STORYWEAVER_API_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
