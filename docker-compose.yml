services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storyweaver
      POSTGRES_USER: storyweaver
      POSTGRES_PASSWORD: storyweaver
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyweaver -d storyweaver"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - storyweaver-postgres:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    environment:
      STORYWEAVER_DATABASE_URL: postgresql+psycopg://storyweaver:storyweaver@postgres:5432/storyweaver
      STORYWEAVER_API_HOST: 0.0.0.0
      STORYWEAVER_API_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      STORYWEAVER_API_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  storyweaver-postgres:
